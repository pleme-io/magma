[package]
name        = "magma-stream"
description = "magma — plan-as-data pipeline. Pipes typed Plan / DriftReport / Outcome into structured sinks (JSON-lines audit, K8s events, in-memory, BLAKE3 Merkle chain). Every magma-converge consumer gets observability + tamper-evident audit for free."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
homepage.workspace     = true
repository.workspace   = true
authors.workspace      = true

[lints]
workspace = true

[dependencies]
magma-converge = { workspace = true }
magma-drift    = { workspace = true }
async-trait    = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
tokio          = { workspace = true }
chrono         = { workspace = true }
blake3         = { workspace = true }
hex            = { workspace = true }
tracing        = { workspace = true }

[dev-dependencies]
tempfile        = { workspace = true }
proptest        = { workspace = true }
magma-fsm       = { workspace = true }
# path-only, NOT `workspace = true`. A dev-dependency that carries a version is
# kept by `cargo package` and resolved against crates.io, and the root pins
# magma-test-laws with a version -- so `workspace = true` makes this a
# published edge. magma-test-laws's `strategies` feature pulls magma-stream,
# which depends on magma-drift: drift -> test-laws -> stream -> drift, a cycle
# no publish order can satisfy. It held 12 crates off crates.io from 2026-08-27
# (cargo package exit 101). A versionless path dev-dep is stripped at package
# time, so the edge cannot close the cycle again.
magma-test-laws = { path = "../magma-test-laws", features = ["strategies"] }
