[package]
name        = "magma-rubygems"
description = "magma — typed in-memory replacement for bundler. Parses Gemfile + *.gemspec, resolves the Pangea Ruby dependency graph in process, materializes a BLAKE3-attested virtual gem tree the embedded CRuby evaluator consumes. Subsumes `bundle install` end-to-end. Per theory/MAGMA-RUBYGEMS.md."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
homepage.workspace     = true
repository.workspace   = true
authors.workspace      = true

[lints]
workspace = true

[dependencies]
blake3     = { workspace = true }
hex        = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = "0.10"
thiserror  = { workspace = true }

[dev-dependencies]
tempfile   = { workspace = true }
