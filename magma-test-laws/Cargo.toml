[package]
name        = "magma-test-laws"
description = "magma — reusable Reconciler-law test helpers. Every new Reconciler impl gets the full law battery (read_state idempotent, compute_plan deterministic, empty plan no-op, apply converges, plan_id changes with config) in 5 lines of test code."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
homepage.workspace     = true
repository.workspace   = true
authors.workspace      = true

[lints]
workspace = true

[features]
default      = []
# Shared proptest strategies — pulls proptest + magma-stream + magma-fsm.
strategies   = ["dep:proptest", "dep:magma-stream", "dep:magma-fsm"]
# Universal Backend trait laws — pulls magma-backend + magma-types
# + magma-state. Any Backend impl can pass `assert_backend_all_laws`.
backend-laws = ["dep:magma-backend", "dep:magma-types", "dep:magma-state"]
# Architecture composition laws over rendered Terraform JSON —
# pulls magma-config. Every Pangea-rendered architecture can pass
# `assert_architecture_all_laws(&cfg)`.
architecture-laws = ["dep:magma-config"]
# Workspace chain laws over magma-flow FlowFile.
# Pulls magma-flow.
chain-laws        = ["dep:magma-flow"]
# Workspace lifecycle laws (apply convergence + destroy round-trip
# + import absorbs). Pulls magma-plan + magma-apply + magma-config +
# magma-state.
workspace-laws    = ["dep:magma-config", "dep:magma-plan", "dep:magma-apply", "dep:magma-state", "dep:magma-types"]

[dependencies]
magma-converge = { workspace = true }
serde_json     = { workspace = true }
tokio          = { workspace = true }
# Optional, gated behind features:
proptest      = { workspace = true, optional = true }
magma-stream  = { workspace = true, optional = true }
magma-fsm     = { workspace = true, optional = true }
magma-backend = { workspace = true, optional = true }
magma-types   = { workspace = true, optional = true }
magma-state   = { workspace = true, optional = true }
magma-config  = { workspace = true, optional = true }
magma-flow    = { workspace = true, optional = true }
magma-plan    = { workspace = true, optional = true }
magma-apply   = { workspace = true, optional = true }

[dev-dependencies]
async-trait   = { workspace = true }
chrono        = { workspace = true }
magma-backend = { workspace = true }
tempfile      = { workspace = true }
