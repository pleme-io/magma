[package]
name        = "magma-test-laws"
description = "magma — reusable Reconciler-law test helpers. Every new Reconciler impl gets the full law battery (read_state idempotent, compute_plan deterministic, empty plan no-op, apply converges, plan_id changes with config) in 5 lines of test code."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
homepage.workspace     = true
repository.workspace   = true
authors.workspace      = true

[lints]
workspace = true

[features]
default    = []
# Opt into the shared proptest strategy library. Pulls in proptest
# + magma-stream + magma-fsm so test crates that only need the
# law battery don't pay for them.
strategies = ["dep:proptest", "dep:magma-stream", "dep:magma-fsm"]

[dependencies]
magma-converge = { workspace = true }
serde_json     = { workspace = true }
tokio          = { workspace = true }
# Optional, gated behind `strategies`:
proptest     = { workspace = true, optional = true }
magma-stream = { workspace = true, optional = true }
magma-fsm    = { workspace = true, optional = true }

[dev-dependencies]
async-trait   = { workspace = true }
chrono        = { workspace = true }
magma-backend = { workspace = true }
