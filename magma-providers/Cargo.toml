[package]
name        = "magma-providers"
description = "magma — provider discovery, download, lock-file round-trip, OpenTofu + Terraform registry protocols."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
homepage.workspace     = true
repository.workspace   = true
authors.workspace      = true

[lints]
workspace = true

[dependencies]
magma-types    = { workspace = true }
magma-plugin   = { workspace = true }
magma-protocol = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
tokio          = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
tonic          = { workspace = true }
# msgpack decode of provider DynamicValue responses (cty wire format).
# rmpv (not rmp-serde) tolerates cty ext-types gracefully rather than
# erroring; a fully-applied resource has no unknowns so the Value maps
# cleanly to serde_json.
rmpv           = { version = "1", features = ["with-serde"] }

[dev-dependencies]
tokio = { workspace = true }
