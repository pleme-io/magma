[package]
name        = "magma-spec"
description = "magma — speculative execution + plan comparison. Pure functions: plan_against_synthetic, compare_plans, what_if. Powers `what would change?` UX without touching live state."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
homepage.workspace     = true
repository.workspace   = true
authors.workspace      = true

[lints]
workspace = true

[dependencies]
magma-converge = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }

[dev-dependencies]
proptest        = { workspace = true }
tokio           = { workspace = true }
magma-test-laws = { workspace = true, features = ["strategies"] }
