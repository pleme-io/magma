[package]
name        = "magma-protocol"
description = "magma — tfplugin5.proto + tfplugin6.proto bindings via prost-build + tonic-build. The protocol surface every provider speaks; no hand-written gRPC anywhere else."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
homepage.workspace     = true
repository.workspace   = true
authors.workspace      = true

[lints]
workspace = true

[lib]
# Generated proto code includes comments parsed as Rust doctests. They
# aren't valid Rust — skip them.
doctest = false

[dependencies]
prost       = { workspace = true }
prost-types = { workspace = true }
tonic       = { workspace = true }
tokio       = { workspace = true }
thiserror   = { workspace = true }

[build-dependencies]
prost-build         = { workspace = true }
tonic-build         = { workspace = true }
protoc-bin-vendored = { workspace = true }
