[workspace]
resolver = "3"
members = [
    "magma",
    "magma-types",
    "magma-cty",
    "magma-config",
    "magma-pangea",
    "magma-protocol",
    "magma-plugin",
    "magma-providers",
    "magma-state",
    "magma-backend",
    "magma-graph",
    "magma-plan",
    "magma-apply",
    "magma-attest",
    "magma-mcp",
    "magma-arch-test",
    "magma-migrate",
    "magma-flow",
    "magma-tatara",
    "magma-fixtures",
    "magma-operator-backend",
    "magma-converge",
    "magma-drift",
    "magma-spec",
    "magma-stream",
    "magma-fsm",
    "magma-test-laws",
    "magma-discover",
    "magma-replay",
    "magma-bundle",
    "magma-budget",
    "magma-metrics",
    "magma-controller",
    "magma-cli",
    "magma-test",
    "magma-rubygems",
    "magma-nix",
    "magma-tfmod",
    "magma-repo",
    "magma-provider-registry",
]

[workspace.package]
version = "0.1.18"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
homepage = "https://github.com/pleme-io/magma"
repository = "https://github.com/pleme-io/magma"
authors = ["pleme-io"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
# ── Workspace crates ─────────────────────────────────────────
# Aliased: the package is `magma-core` on crates.io (the bare name is
# RustCrypto's), but it stays `magma` to every consumer in this workspace, so
# no `use magma::…` had to change for the rename.
magma           = { path = "magma", version = "0.1.18", package = "magma-core" }
magma-types     = { path = "magma-types", version = "0.1.18" }
magma-cty       = { path = "magma-cty", version = "0.1.18" }

# Gen-platform — typed-dispatcher catalog integration
# (theory/UNIFIED-COMPUTING-MODEL.md §VI).
gen-platform = "0.1.34"
gen-types = "0.1.34"
magma-config    = { path = "magma-config", version = "0.1.18" }
magma-pangea    = { path = "magma-pangea", version = "0.1.18" }
magma-protocol  = { path = "magma-protocol", version = "0.1.18" }
magma-plugin    = { path = "magma-plugin", version = "0.1.18" }
magma-providers = { path = "magma-providers", version = "0.1.18" }
magma-state     = { path = "magma-state", version = "0.1.18" }
magma-backend   = { path = "magma-backend", version = "0.1.18" }
magma-graph     = { path = "magma-graph", version = "0.1.18" }
magma-plan      = { path = "magma-plan", version = "0.1.18" }
magma-apply     = { path = "magma-apply", version = "0.1.18" }
magma-attest    = { path = "magma-attest", version = "0.1.18" }
magma-mcp       = { path = "magma-mcp", version = "0.1.18" }
magma-arch-test = { path = "magma-arch-test", version = "0.1.18" }
magma-migrate   = { path = "magma-migrate", version = "0.1.18" }
magma-flow      = { path = "magma-flow", version = "0.1.18" }
magma-tatara    = { path = "magma-tatara", version = "0.1.18" }
magma-fixtures  = { path = "magma-fixtures", version = "0.1.18" }
magma-operator-backend = { path = "magma-operator-backend", version = "0.1.18" }
magma-converge  = { path = "magma-converge", version = "0.1.18" }
magma-drift     = { path = "magma-drift", version = "0.1.18" }
magma-spec      = { path = "magma-spec", version = "0.1.18" }
magma-stream    = { path = "magma-stream", version = "0.1.18" }
magma-fsm       = { path = "magma-fsm", version = "0.1.18" }
magma-test-laws = { path = "magma-test-laws", version = "0.1.18" }
magma-discover  = { path = "magma-discover", version = "0.1.18" }
magma-replay    = { path = "magma-replay", version = "0.1.18" }
magma-bundle    = { path = "magma-bundle", version = "0.1.18" }
magma-budget    = { path = "magma-budget", version = "0.1.18" }
magma-metrics   = { path = "magma-metrics", version = "0.1.18" }
magma-controller = { path = "magma-controller", version = "0.1.18" }
magma-test      = { path = "magma-test", version = "0.1.18" }
magma-rubygems  = { path = "magma-rubygems", version = "0.1.18" }
magma-nix       = { path = "magma-nix", version = "0.1.18" }
magma-tfmod     = { path = "magma-tfmod", version = "0.1.18" }
magma-repo      = { path = "magma-repo", version = "0.1.18" }
magma-provider-registry = { path = "magma-provider-registry", version = "0.1.18" }

# ── Pleme-io primitives — crates.io, NOT git ──
# A bare git dep makes this workspace structurally unpublishable: cargo
# refuses to package a dependency with no version requirement. It also
# duplicates each crate in every consumer, since cargo never unifies
# registry+git even at an identical version. magma-lava below is the one
# remaining git dep and it is a genuine cycle, not an oversight: magma-lava
# depends on magma-config, which is a member of THIS workspace. It flips as
# soon as magma-config is on the registry.
shikumi          = "0.1.496"
shigoto          = "0.1.15"
shigoto-types    = "0.1.15"
# samba light core (LeakyBucket pacer), NATS-free — the apply engine paces
# provider mutation RPCs under GitHub's secondary rate limit.
samba            = { version = "0.1.4", default-features = false }
magma-lava       = { git = "https://github.com/pleme-io/magma-lava", branch = "main" }
# Secret-file creation. tfstate holds provider-marked sensitive attributes in
# plaintext by design, so the file's mode is the only protection the format
# offers — cofre-fs establishes it at open(2) instead of chmod'ing afterwards.
cofre-fs         = "0.1.4"
indexmap         = { version = "2", features = ["serde"] }
# pangea-ruby-eval is consumed via the `magnus` feature on magma-pangea —
# the actual git dep is declared there to avoid forcing CRuby on every
# downstream consumer's build.

# ── Serialization ────────────────────────────────────────────
serde         = { version = "1", features = ["derive"] }
serde_json    = { version = "1" }
serde_yaml_ng = "0.10"
toml          = "0.8"
schemars      = { version = "0.8", features = ["derive"] }
# msgpack Value (with ext-type support) — the cty DynamicValue codec
# in magma-cty needs the unknown-value extension (ext type 0).
rmpv          = "1"

# ── Error handling ───────────────────────────────────────────
thiserror = "2"
anyhow    = "1"

# ── Proc-macro deps ──────────────────────────────────────────
syn          = { version = "2", features = ["full", "extra-traits"] }
quote        = "1"
proc-macro2  = "1"

# ── Async ────────────────────────────────────────────────────
# `io-std` is declared explicitly (added 2026-08-06) because magma-cli calls
# `tokio::io::stdin()`. It compiled before without being listed here only by
# ACCIDENT: tonic 0.12 happened to enable `tokio/io-std` transitively, and
# cargo's feature unification handed it to us. tonic 0.13 stopped enabling it,
# and magma-cli instantly failed with `cannot find function stdin in module
# tokio::io`. The bump did not break this — it revealed that a feature we
# depend on directly was never ours. A crate must declare the features it
# actually calls; inheriting one through an unrelated dependency's graph is a
# build that works until someone else's dependency changes.
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "net", "signal", "fs"] }
tokio-stream = { version = "0.1", features = ["net"] }
async-trait  = "0.1"
futures      = "0.3"

# ── CLI ──────────────────────────────────────────────────────
clap = { version = "4", features = ["derive", "env"] }

# ── Logging / tracing ────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# ── Graph + algorithms ───────────────────────────────────────
petgraph = "0.6"

# ── IDs / time / misc ────────────────────────────────────────
uuid   = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"

# ── Networking / utilities ───────────────────────────────────
ipnet  = { version = "2", features = ["serde"] }
base64 = "0.22"
rand   = "0.8"
which  = "6"
hex    = "0.4"

# ── Database (optional, feature-gated in consumers) ─────────────────────────
# Postgres driver for the dynamic provider registry. Pure-Rust TLS
# (rustls) so it builds without a system libpq; runtime-tokio so it
# shares the apply engine's tokio runtime.
sqlx   = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "chrono"] }

# ── Protobuf / gRPC (plugin protocol) ────────────────────────
prost       = "0.13"
prost-types = "0.13"
# 0.12 -> 0.13 is a SECURITY bump. tonic 0.12.3 depends on `rustls-pemfile`
# (RUSTSEC-2025-0134, unmaintained, `patched: []`), and 0.13.0 is the first
# release that drops it — so this is the at-cause fix for every consumer that
# was inheriting that advisory through magma's gRPC stack. Removing the
# unused direct declaration above was necessary but NOT sufficient: it only
# moved the edge onto tonic.
# Narrow on purpose: 0.13 keeps prost 0.13, hyper 1 and tower 0.5, so nothing
# else in this block moves. The one breaking change that touches us is the TLS
# feature split — 0.13 replaced `tls` with `tls-ring` / `tls-aws-lc`. `ring` is
# the right half here because the workspace rustls above is
# `features = ["ring"]`; picking aws-lc would pull a second crypto backend.
tonic       = { version = "0.13", features = ["transport", "tls-ring", "tls-webpki-roots"] }
tower       = "0.5"
hyper       = { version = "1", features = ["client", "http2"] }
hyper-util  = { version = "0.1", features = ["tokio"] }
http        = "1"
http-body-util = "0.1"
bytes       = "1"

# Build-deps for magma-protocol
prost-build         = "0.13"
# Kept in lockstep with tonic above — tonic-build emits code against tonic's
# own API, so a version skew here produces generated code that will not compile.
tonic-build         = "0.13"
protoc-bin-vendored = "3"

# ── mTLS (go-plugin handshake) ───────────────────────────────
rustls         = { version = "0.23", features = ["ring"] }
# rustls-pemfile REMOVED 2026-08-06. It was declared here and in magma-plugin
# and had ZERO call sites anywhere in the workspace — grep for
# `rustls_pemfile` across every .rs returns nothing. magma-plugin only ever
# GENERATES pem (rcgen's `cert.pem()` / `key_pair.serialize_pem()`); it never
# parses any, which is the only thing rustls-pemfile does.
# It was not free: the crate is unmaintained (RUSTSEC-2025-0134, `patched: []`
# — superseded by rustls-pki-types' own pem support), so every downstream
# consumer inherited an advisory from a dependency magma does not call.
# NOTE: this does NOT remove the crate from magma's own lock — tonic 0.12.3
# also depends on it, so magma's own audit still flags it and closing that
# needs a tonic bump. What it removes is the magma-plugin path, which is how
# consumers like pangea-operator were picking it up.
tokio-rustls   = "0.26"
rcgen          = "0.13"

# ── Testing ──────────────────────────────────────────────────
tempfile = "3"
proptest = "1"
insta    = "1"

# ── Metrics ──────────────────────────────────────────────────
# Standard Prometheus client. 0.13 -> 0.14 (2026-08-06) is a SECURITY bump:
# 0.13.4 depends on `protobuf ^2.0`, resolving to 2.28.0, which carries
# RUSTSEC-2024-0437 (uncontrolled recursion — a crash on hostile input).
# prometheus 0.14.0 moves to `protobuf ^3.7.2`, which is the patched line, so
# the fix is here rather than a pin on protobuf itself.
# The old comment claimed this version was held to match pangea-operator's
# `prometheus = "0.13"` for metric-name/label alignment. That reasoning does
# not survive contact: metric names and label conventions are what THIS code
# passes to the client, not something the client version dictates, and no
# metric name changes in this diff. Keeping a vulnerable transitive protobuf
# to match a sibling repo's version number would be cargo-culting the number
# rather than the convention.
prometheus = "0.14"

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "z"
strip         = true
