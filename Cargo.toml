[workspace]
resolver = "3"
members = [
    "magma",
    "magma-types",
    "magma-config",
    "magma-pangea",
    "magma-protocol",
    "magma-plugin",
    "magma-providers",
    "magma-state",
    "magma-backend",
    "magma-graph",
    "magma-plan",
    "magma-apply",
    "magma-attest",
    "magma-mcp",
    "magma-arch-test",
    "magma-migrate",
    "magma-flow",
    "magma-tatara",
    "magma-fixtures",
    "magma-operator-backend",
    "magma-converge",
    "magma-drift",
    "magma-spec",
    "magma-stream",
    "magma-fsm",
    "magma-test-laws",
    "magma-discover",
    "magma-replay",
    "magma-bundle",
    "magma-budget",
    "magma-cli",
    "magma-test",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
homepage = "https://github.com/pleme-io/magma"
repository = "https://github.com/pleme-io/magma"
authors = ["pleme-io"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
# ── Workspace crates ─────────────────────────────────────────
magma           = { path = "magma" }
magma-types     = { path = "magma-types" }
magma-config    = { path = "magma-config" }
magma-pangea    = { path = "magma-pangea" }
magma-protocol  = { path = "magma-protocol" }
magma-plugin    = { path = "magma-plugin" }
magma-providers = { path = "magma-providers" }
magma-state     = { path = "magma-state" }
magma-backend   = { path = "magma-backend" }
magma-graph     = { path = "magma-graph" }
magma-plan      = { path = "magma-plan" }
magma-apply     = { path = "magma-apply" }
magma-attest    = { path = "magma-attest" }
magma-mcp       = { path = "magma-mcp" }
magma-arch-test = { path = "magma-arch-test" }
magma-migrate   = { path = "magma-migrate" }
magma-flow      = { path = "magma-flow" }
magma-tatara    = { path = "magma-tatara" }
magma-fixtures  = { path = "magma-fixtures" }
magma-operator-backend = { path = "magma-operator-backend" }
magma-converge  = { path = "magma-converge" }
magma-drift     = { path = "magma-drift" }
magma-spec      = { path = "magma-spec" }
magma-stream    = { path = "magma-stream" }
magma-fsm       = { path = "magma-fsm" }
magma-test-laws = { path = "magma-test-laws" }
magma-discover  = { path = "magma-discover" }
magma-replay    = { path = "magma-replay" }
magma-bundle    = { path = "magma-bundle" }
magma-budget    = { path = "magma-budget" }
magma-test      = { path = "magma-test" }

# ── Pleme-io primitives (git deps; nixpkgs.follows enforced in flake.nix) ──
shikumi          = { git = "https://github.com/pleme-io/shikumi" }
shigoto          = { git = "https://github.com/pleme-io/shigoto" }
# pangea-ruby-eval is consumed via the `magnus` feature on magma-pangea —
# the actual git dep is declared there to avoid forcing CRuby on every
# downstream consumer's build.

# ── Serialization ────────────────────────────────────────────
serde         = { version = "1", features = ["derive"] }
serde_json    = { version = "1" }
serde_yaml_ng = "0.10"
toml          = "0.8"
schemars      = { version = "0.8", features = ["derive"] }

# ── Error handling ───────────────────────────────────────────
thiserror = "2"
anyhow    = "1"

# ── Async ────────────────────────────────────────────────────
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net", "signal", "fs"] }
tokio-stream = { version = "0.1", features = ["net"] }
async-trait  = "0.1"
futures      = "0.3"

# ── CLI ──────────────────────────────────────────────────────
clap = { version = "4", features = ["derive", "env"] }

# ── Logging / tracing ────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# ── Graph + algorithms ───────────────────────────────────────
petgraph = "0.6"

# ── IDs / time / misc ────────────────────────────────────────
uuid   = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"

# ── Networking / utilities ───────────────────────────────────
ipnet  = { version = "2", features = ["serde"] }
base64 = "0.22"
rand   = "0.8"
which  = "6"
hex    = "0.4"

# ── Protobuf / gRPC (plugin protocol) ────────────────────────
prost       = "0.13"
prost-types = "0.13"
tonic       = { version = "0.12", features = ["transport", "tls", "tls-webpki-roots"] }
tower       = "0.5"
hyper-util  = { version = "0.1", features = ["tokio"] }
http        = "1"

# Build-deps for magma-protocol
prost-build         = "0.13"
tonic-build         = "0.12"
protoc-bin-vendored = "3"

# ── mTLS (go-plugin handshake) ───────────────────────────────
rustls         = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
tokio-rustls   = "0.26"
rcgen          = "0.13"

# ── Testing ──────────────────────────────────────────────────
tempfile = "3"
proptest = "1"
insta    = "1"

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "z"
strip         = true
