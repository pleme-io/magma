[workspace]
resolver = "3"
members = [
    "magma",
    "magma-types",
    "magma-cty",
    "magma-config",
    "magma-pangea",
    "magma-protocol",
    "magma-plugin",
    "magma-providers",
    "magma-state",
    "magma-backend",
    "magma-graph",
    "magma-plan",
    "magma-apply",
    "magma-attest",
    "magma-mcp",
    "magma-arch-test",
    "magma-migrate",
    "magma-flow",
    "magma-tatara",
    "magma-fixtures",
    "magma-operator-backend",
    "magma-converge",
    "magma-drift",
    "magma-spec",
    "magma-stream",
    "magma-fsm",
    "magma-test-laws",
    "magma-discover",
    "magma-replay",
    "magma-bundle",
    "magma-budget",
    "magma-metrics",
    "magma-controller",
    "magma-cli",
    "magma-test",
    "magma-rubygems",
    "magma-nix",
    "magma-tfmod",
    "magma-repo",
    "magma-provider-registry",
]

[workspace.package]
version = "0.1.15"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
homepage = "https://github.com/pleme-io/magma"
repository = "https://github.com/pleme-io/magma"
authors = ["pleme-io"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
# ── Workspace crates ─────────────────────────────────────────
# Aliased: the package is `magma-core` on crates.io (the bare name is
# RustCrypto's), but it stays `magma` to every consumer in this workspace, so
# no `use magma::…` had to change for the rename.
magma           = { path = "magma", version = "0.1.15", package = "magma-core" }
magma-types     = { path = "magma-types", version = "0.1.15" }
magma-cty       = { path = "magma-cty", version = "0.1.15" }

# Gen-platform — typed-dispatcher catalog integration
# (theory/UNIFIED-COMPUTING-MODEL.md §VI).
gen-platform = { git = "https://github.com/pleme-io/gen" }
gen-types = { git = "https://github.com/pleme-io/gen" }
magma-config    = { path = "magma-config", version = "0.1.15" }
magma-pangea    = { path = "magma-pangea", version = "0.1.15" }
magma-protocol  = { path = "magma-protocol", version = "0.1.15" }
magma-plugin    = { path = "magma-plugin", version = "0.1.15" }
magma-providers = { path = "magma-providers", version = "0.1.15" }
magma-state     = { path = "magma-state", version = "0.1.15" }
magma-backend   = { path = "magma-backend", version = "0.1.15" }
magma-graph     = { path = "magma-graph", version = "0.1.15" }
magma-plan      = { path = "magma-plan", version = "0.1.15" }
magma-apply     = { path = "magma-apply", version = "0.1.15" }
magma-attest    = { path = "magma-attest", version = "0.1.15" }
magma-mcp       = { path = "magma-mcp", version = "0.1.15" }
magma-arch-test = { path = "magma-arch-test", version = "0.1.15" }
magma-migrate   = { path = "magma-migrate", version = "0.1.15" }
magma-flow      = { path = "magma-flow", version = "0.1.15" }
magma-tatara    = { path = "magma-tatara", version = "0.1.15" }
magma-fixtures  = { path = "magma-fixtures", version = "0.1.15" }
magma-operator-backend = { path = "magma-operator-backend", version = "0.1.15" }
magma-converge  = { path = "magma-converge", version = "0.1.15" }
magma-drift     = { path = "magma-drift", version = "0.1.15" }
magma-spec      = { path = "magma-spec", version = "0.1.15" }
magma-stream    = { path = "magma-stream", version = "0.1.15" }
magma-fsm       = { path = "magma-fsm", version = "0.1.15" }
magma-test-laws = { path = "magma-test-laws", version = "0.1.15" }
magma-discover  = { path = "magma-discover", version = "0.1.15" }
magma-replay    = { path = "magma-replay", version = "0.1.15" }
magma-bundle    = { path = "magma-bundle", version = "0.1.15" }
magma-budget    = { path = "magma-budget", version = "0.1.15" }
magma-metrics   = { path = "magma-metrics", version = "0.1.15" }
magma-controller = { path = "magma-controller", version = "0.1.15" }
magma-test      = { path = "magma-test", version = "0.1.15" }
magma-rubygems  = { path = "magma-rubygems", version = "0.1.15" }
magma-nix       = { path = "magma-nix", version = "0.1.15" }
magma-tfmod     = { path = "magma-tfmod", version = "0.1.15" }
magma-repo      = { path = "magma-repo", version = "0.1.15" }
magma-provider-registry = { path = "magma-provider-registry", version = "0.1.15" }

# ── Pleme-io primitives (git deps; nixpkgs.follows enforced in flake.nix) ──
shikumi          = { git = "https://github.com/pleme-io/shikumi" }
shigoto          = { git = "https://github.com/pleme-io/shigoto", rev = "c8792add60be360ff29788f87f3bd46a2b666af6" }
shigoto-types    = { git = "https://github.com/pleme-io/shigoto", rev = "c8792add60be360ff29788f87f3bd46a2b666af6" }
# samba light core (LeakyBucket pacer), NATS-free — the apply engine paces
# provider mutation RPCs under GitHub's secondary rate limit.
samba            = { git = "https://github.com/pleme-io/samba", rev = "29650485132f635429291b08c5b2cdc5f9293500", default-features = false }
magma-lava       = { git = "https://github.com/pleme-io/magma-lava", branch = "main" }
indexmap         = { version = "2", features = ["serde"] }
# pangea-ruby-eval is consumed via the `magnus` feature on magma-pangea —
# the actual git dep is declared there to avoid forcing CRuby on every
# downstream consumer's build.

# ── Serialization ────────────────────────────────────────────
serde         = { version = "1", features = ["derive"] }
serde_json    = { version = "1" }
serde_yaml_ng = "0.10"
toml          = "0.8"
schemars      = { version = "0.8", features = ["derive"] }
# msgpack Value (with ext-type support) — the cty DynamicValue codec
# in magma-cty needs the unknown-value extension (ext type 0).
rmpv          = "1"

# ── Error handling ───────────────────────────────────────────
thiserror = "2"
anyhow    = "1"

# ── Proc-macro deps ──────────────────────────────────────────
syn          = { version = "2", features = ["full", "extra-traits"] }
quote        = "1"
proc-macro2  = "1"

# ── Async ────────────────────────────────────────────────────
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net", "signal", "fs"] }
tokio-stream = { version = "0.1", features = ["net"] }
async-trait  = "0.1"
futures      = "0.3"

# ── CLI ──────────────────────────────────────────────────────
clap = { version = "4", features = ["derive", "env"] }

# ── Logging / tracing ────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# ── Graph + algorithms ───────────────────────────────────────
petgraph = "0.6"

# ── IDs / time / misc ────────────────────────────────────────
uuid   = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"

# ── Networking / utilities ───────────────────────────────────
ipnet  = { version = "2", features = ["serde"] }
base64 = "0.22"
rand   = "0.8"
which  = "6"
hex    = "0.4"

# ── Database (optional, feature-gated in consumers) ─────────────────────────
# Postgres driver for the dynamic provider registry. Pure-Rust TLS
# (rustls) so it builds without a system libpq; runtime-tokio so it
# shares the apply engine's tokio runtime.
sqlx   = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "chrono"] }

# ── Protobuf / gRPC (plugin protocol) ────────────────────────
prost       = "0.13"
prost-types = "0.13"
tonic       = { version = "0.12", features = ["transport", "tls", "tls-webpki-roots"] }
tower       = "0.5"
hyper       = { version = "1", features = ["client", "http2"] }
hyper-util  = { version = "0.1", features = ["tokio"] }
http        = "1"
http-body-util = "0.1"
bytes       = "1"

# Build-deps for magma-protocol
prost-build         = "0.13"
tonic-build         = "0.12"
protoc-bin-vendored = "3"

# ── mTLS (go-plugin handshake) ───────────────────────────────
rustls         = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
tokio-rustls   = "0.26"
rcgen          = "0.13"

# ── Testing ──────────────────────────────────────────────────
tempfile = "3"
proptest = "1"
insta    = "1"

# ── Metrics ──────────────────────────────────────────────────
# Standard Prometheus client. Matches pangea-operator's
# `prometheus = "0.13"` so metric names + label conventions
# align with the existing fleet observability stack.
prometheus = "0.13"

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "z"
strip         = true
